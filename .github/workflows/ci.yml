name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (self-contained)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Use system Python
        run: python3 --version
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Python compile check
        run: python3 -m compileall app
      - name: Docker compose config check
        run: docker compose config >/dev/null

  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (self-contained)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Block obvious hardcoded secrets
        run: |
          ! grep -rEnI "(sk_live|sk_test|ghp_|api_key=)" . \
            --exclude-dir=.git --exclude-dir=.github --exclude="*.md"

  smoke-contract:
    runs-on: ubuntu-latest
    needs: [runtime-integrity, secret-hygiene]
    steps:
      - name: Checkout (self-contained)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/system/health || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1
      - name: Endpoint contract
        run: |
          curl -s http://localhost:8000/system/health | jq -e '.system_health and (.axis_health | length == 8) and (.single_point_of_failure != null)'
          curl -s http://localhost:8000/system/economic-weight | jq -e '.system_economic_weight != null and .axis_economic_weight != null'
          test "$(curl -s http://localhost:8000/catalog/connectors | jq '.items | length')" = "20"
          test "$(curl -s http://localhost:8000/catalog/axes | jq '.items | length')" = "8"
      - name: Metrics contract
        run: |
          curl -s http://localhost:8000/metrics | grep -q "balancehub_breaker_state"
          curl -s http://localhost:8000/metrics | grep -q "balancehub_stability_score"
      - name: Teardown
        if: always()
        run: docker compose down -v
