name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: APΩ ontology lint
        run: python ops/lint_apo_check.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall app
      - name: Docker compose config check
        run: docker compose config >/dev/null

  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block obvious hardcoded secrets
        run: |
          ! rg -n "(sk_live|sk_test|ghp_|api_key=)" .

  smoke-contract:
    runs-on: ubuntu-latest
    needs: [runtime-integrity, secret-hygiene]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/system/health || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1
      - name: Endpoint contract
        run: |
          curl -s http://localhost:8000/system/health | jq -e '.system_health and (.axis_health | length == 8) and (.single_point_of_failure != null)'
          curl -s http://localhost:8000/system/economic-weight | jq -e '.system_economic_weight != null and .axis_economic_weight != null'
          test "$(curl -s http://localhost:8000/catalog/connectors | jq '.items | length')" = "20"
          test "$(curl -s http://localhost:8000/catalog/axes | jq '.items | length')" = "8"
      - name: Metrics contract
        run: |
          curl -s http://localhost:8000/metrics | rg "balancehub_breaker_state"
          curl -s http://localhost:8000/metrics | rg "balancehub_stability_score"
      - name: Teardown
        if: always()
        run: docker compose down -v
