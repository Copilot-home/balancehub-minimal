version: "3.9"

services:

  api:
    build: .
    container_name: balancehub-api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://hub:hubpass@postgres:5432/balancehub
      - REDIS_URL=redis://redis:6379
      # Public-safe default: no external secret required.
      - STRIPE_API_KEY=
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: balancehub-postgres
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hubpass
      POSTGRES_DB: balancehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: balancehub-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: balancehub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

volumes:
  pgdata:
